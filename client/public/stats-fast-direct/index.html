<script>
const PARAMS=new URLSearchParams(location.search),FD_SESSION=PARAMS.get("session")||"",FD_MODE=PARAMS.get("mode")||"",FD_BENCH=FD_MODE==="bench",FD_LIVE=Boolean(FD_SESSION&&(FD_MODE==="live"||FD_MODE==="bench")),FD_THEME=PARAMS.get("theme");

const CATS=[["S","SERVICE",["S#","S+","S!","S0","S-","S="]],["ATT","ATTAQUE",["ATT#","ATT+","ATT0","ATT/","ATT="]],["C","BLOC",["C#","C+","C0","C="]],["R","RÉCEPTION",["R#","R+","R0","R!","R-","R="]],["D","DÉFENSE",["D#","D0","D-","D="]],["REL","RELANCE",["REL#","REL0","REL-","REL="]]];

let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
if(!S.v&&!S.actions.length&&!S.archive.length)S=fresh();S.v=2;fix();
let saveMsg="",applyingRemote=false,lastSyncedJson=JSON.stringify(S),lastSyncedState=JSON.parse(lastSyncedJson);
function save(triggerAction){try{localStorage.setItem(KEY,JSON.stringify(S));saveMsg="Sauvegardé "+new Date().toLocaleTimeString("fr-FR")}catch(e){saveMsg="Sauvegarde locale indisponible"}
 if(FD_LIVE&&!FD_BENCH&&!applyingRemote){const nextJson=JSON.stringify(S);if(nextJson!==lastSyncedJson){const force=["rz","newm","demo","oa","endsave","imp"].includes(triggerAction||"");try{window.parent.postMessage({type:"fd-stats:change",sessionId:FD_SESSION,prevState:lastSyncedState,state:JSON.parse(nextJson),forceReplace:force},location.origin);lastSyncedJson=nextJson;lastSyncedState=JSON.parse(nextJson)}catch(err){}}}}

const g=(c,k)=>(c&&c[k])||0,tot=(c,i)=>CATS[i][2].reduce((s,l)=>s+g(c,l),0);

const FORM={ // formules confirmées par la grille PDF
 ATT:(c,t)=>pc(g(c,"ATT#")-g(c,"ATT="),t),      // (ATT# - ATT=) / total attaques
 R:(c,t)=>pc(g(c,"R#")+g(c,"R+")-g(c,"R="),t)}; // (R# + R+ - R=) / total réceptions
function ind(c){const pts=g(c,"S#")+g(c,"ATT#")+g(c,"C#"),div=g(c,"C=")+g(c,"R=")+g(c,"D=")+g(c,"REL=")+g(c,"DIV="),s=g(c,"S="),a=g(c,"ATT=");return{pts,s,a,div,fautes:s+a+div,diff:pts-s-a-div}}

 return{head:["Joueur",...ls,"Total",...(FORM[k]?["Eff"]:[])],rows:D.players.map(p=>mk(p.num+" "+p.first,m[p.id])),team:mk("ÉQUIPE",m["*"])}}
function ratioRows(D,m){return[...D.players.map(p=>[p.num+" "+p.first,m[p.id]]),["ÉQUIPE",m["*"]]].map(([n,c])=>{const x=ind(c);return[n,g(c,"S#"),g(c,"ATT#"),g(c,"C#"),x.s,x.a,x.div,x.diff]})}
function pts(D,set){let u=0,o=0;D.match.scores.forEach((s,i)=>{if(!set||set===i+1){u+=s.u;o+=s.o}});return{u,o}}
function offers(D,m,set){const x=ind(m["*"]),p=pts(D,set),a=advTot(D,set);return{us:{s:x.s,a:x.a,d:x.div,t:x.s+x.a+x.div,pct:pc(x.s+x.a+x.div,p.o)},adv:{s:a.s,a:a.a,d:a.d,t:a.s+a.a+a.d,pct:pc(a.s+a.a+a.d,p.u)}}}
