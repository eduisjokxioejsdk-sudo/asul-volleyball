# ============================================================================
# Construction et publication de l'installeur Windows (mise à jour automatique).
#
# À chaque push sur `main` (ou via le bouton « Run workflow »), ce workflow :
#   1. vérifie que la version de version.json n'a pas encore de Release GitHub ;
#   2. écrit la configuration Supabase pré-remplie (clé issue du secret) ;
#   3. construit l'installeur `ASUL-Setup-x.y.z.exe` + `latest.yml` ;
#   4. les publie dans une Release GitHub (tag `vx.y.z`).
#
# Les applications installées détectent alors la nouvelle version via
# electron-updater et se mettent à jour toutes seules.
#
# Secret requis (Settings → Secrets and variables → Actions) :
#   SUPABASE_ANON_KEY  = clé « anon » publique du projet Supabase.
# ============================================================================

name: Build & publier (mise à jour automatique)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Version courante
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Cette version est-elle déjà publiée ?
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $url = "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$v"
          # La version n'est considérée publiée que si la Release contient TOUT ce dont
          # la mise à jour automatique a besoin : l'installeur ET latest.yml. Une Release
          # créée mais incomplète (envoi interrompu) doit être reconstruite, sinon plus
          # aucune mise à jour n'aboutirait pour cette version, sans aucun signal.
          $required = @("ASUL-Setup-$v.exe", "latest.yml")
          $exists = $false
          try {
            $release = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "asul-ci" }
            $names = @($release.assets | ForEach-Object { $_.name })
            $missing = @($required | Where-Object { $names -notcontains $_ })
            if ($missing.Count -eq 0) {
              $exists = $true
            } else {
              Write-Host "Release v$v incomplete (assets manquants : $($missing -join ', ')) : reconstruction."
            }
          } catch {
            Write-Host "Aucune Release v$v : construction."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=$($exists.ToString().ToLower())"

      - name: Clé Supabase présente ?
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SUPABASE_ANON_KEY }}")) {
            Write-Error "Secret SUPABASE_ANON_KEY absent : ajoutez-le dans Settings → Secrets and variables → Actions, puis relancez."
          }

      - name: Écrire la configuration Supabase pré-remplie
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/resources" | Out-Null
          $sync = [ordered]@{
            enabled = $true
            provider = "supabase"
            url = "https://ywxijozqdzmqhbcgkgti.supabase.co"
            key = $env:SUPABASE_ANON_KEY
            intervalMs = 60000
          }
          $sync | ConvertTo-Json | Set-Content -Path "desktop/resources/sync.json" -Encoding utf8

      - name: Cache de ffmpeg (téléchargé une seule fois)
        if: steps.exists.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: desktop/resources/ffmpeg
          # Une clé versionnée : incrémenter le suffixe pour forcer un nouveau
          # téléchargement (changement de miroir, mise à jour de ffmpeg).
          key: ffmpeg-essentials-${{ runner.os }}-v1

      - name: Installer les dépendances
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          npm ci --prefix client
          npm ci --prefix server
          npm ci --prefix desktop

      - name: Créer la Release GitHub (l'installeur y sera déposé)
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder crée lui-même la Release s'il ne la trouve pas, mais
          # sa requête de création peut être rejetée par GitHub (422 « Published
          # releases must have a valid tag ») quand le tag est créé au même
          # moment. On crée donc la Release ici, une bonne fois : electron-builder
          # se contentera ensuite d'y déposer les fichiers.
          $v = "${{ steps.version.outputs.version }}"
          $body = @{ tag_name = "v$v"; name = "$v"; draft = $false; prerelease = $false } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "asul-ci" } -ContentType "application/json; charset=utf-8" -Body $body | Out-Null
            Write-Host "Release v$v créée."
          } catch {
            Write-Host "Release v$v déjà présente : $($_.Exception.Message)"
          }

      - name: Construire et publier l'installeur
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Autorise l'envoi dans une Release publiée depuis plus de deux heures :
          # sans cela electron-builder refuserait d'y déposer les fichiers et une
          # publication interrompue ne pourrait jamais être réparée.
          EP_GH_IGNORE_TIME: "true"
        run: |
          Set-Location desktop
          npm run dist:publish

      - name: Vérifier que la Release est complète
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Une Release sans latest.yml ne permettrait aucune mise à jour : on
          # échoue explicitement au lieu de laisser passer une publication
          # partielle (la prochaine exécution la reconstruira).
          $v = "${{ steps.version.outputs.version }}"
          $url = "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$v"
          $release = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "asul-ci" }
          $names = @($release.assets | ForEach-Object { $_.name })
          $missing = @(@("ASUL-Setup-$v.exe", "latest.yml") | Where-Object { $names -notcontains $_ })
          if ($missing.Count -gt 0) {
            Write-Error "Release v$v incomplète : $($missing -join ', ') manquant(s)."
          }
          Write-Host "Release v$v complète : $($names -join ', ')"
